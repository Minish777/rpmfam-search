[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpmfam-search"
version = "1.0.0"
description = "Поиск по списку зарегистрированных фамилий: представители, заместители, номера"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
keywords = ["rpm", "фамилии", "реестр", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
rpmfam-search = "rpmfam_search:main"

[tool.setuptools]
py-modules = ["rpmfam_search", "rpname"]
